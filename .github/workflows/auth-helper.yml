# 菁鷹：把 Firebase 登入輔助檔放在 a760235074-lang.github.io 的根目錄，
# 讓 iPhone 主畫面 App 的 Google 登入不再被 Safari 擋住。每週一自動同步最新版。
name: Sync Firebase auth helper
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download helper files
        run: |
          set -e
          B=https://jingying-fafa2.firebaseapp.com
          mkdir -p site/__/auth site/__/firebase
          for f in handler iframe links; do curl -fsSL "$B/__/auth/$f" -o "site/__/auth/$f.html"; done
          for f in handler.js experiments.js iframe.js links.js; do curl -fsSL "$B/__/auth/$f" -o "site/__/auth/$f"; done
          echo '{"apiKey":"AIzaSyAOSxEmIPnBoYlDnpAMPrS93VENRUwVlGs","appId":"1:188541739876:web:175d31275d27b45cacd071","authDomain":"jingying-fafa2.firebaseapp.com","messagingSenderId":"188541739876","projectId":"jingying-fafa2","storageBucket":"jingying-fafa2.firebasestorage.app"}' > site/__/firebase/init.json
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/jingying/"><a href="/jingying/">菁鷹直排輪</a>' > site/index.html
          touch site/.nojekyll
          ls -la site/__/auth site/__/firebase
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
